repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: system
        pass_filenames: false
        types: [python]
